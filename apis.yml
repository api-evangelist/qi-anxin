aid: qi-anxin
name: Qi Anxin
description: 'Qi An Xin Technology Group (QAX, 奇安信) is a Beijing-headquartered cybersecurity vendor founded
  in 2014 and listed on the Shanghai Stock Exchange STAR Market (688561), with more than 10,000 employees
  across 65 branches. It builds enterprise- and national-scale security products spanning security operations
  and response (SIEM, NDR, vulnerability management), threat intelligence (TIP, TIOS, cyberspace mapping),
  network and perimeter security (NGFW, WAF, SD-WAN, secure web gateway), endpoint and identity security
  (EDR, zero-trust network access, privileged access management) and digital forensics. Its public developer
  surface is the QAX Threat Intelligence Center (ti.qianxin.com): an Api-Key authenticated REST reputation
  and intelligence API on webapi.ti.qianxin.com, and a hosted Model Context Protocol server at mcp.ti.qianxin.com
  that exposes sixteen threat-intelligence query tools to AI clients. QAX also operates the Butian (补天)
  vulnerability response platform and was the official cybersecurity services sponsor of the Beijing 2022
  Olympic and Paralympic Winter Games.'
