- name: QAX Threat Intelligence MCP Service
  description: Hosted Model Context Protocol server published by the QAX Threat Intelligence Center, announced
    on the QAX newsroom 2025-05-13. Exposes sixteen threat-intelligence query tools (vulnerability lookup,
    IP/domain/hash reputation, IOC and attack graphs, threat-actor profiles, batch variants) to any MCP-capable
    AI client over Streamable HTTP, authenticated with an `Api-Key` header. The SSE transport is published
    as deprecated and no longer maintained.
  humanURL: https://github.com/RedDrip7/qax-ti-mcp
  baseURL: https://mcp.ti.qianxin.com/ti-stream-mcp
