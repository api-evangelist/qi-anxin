apis:
- name: QAX Threat Intelligence API
  description: 'REST threat-intelligence API from the QAX Threat Intelligence Center. Provides IP reputation,
    domain and URL reputation, file/hash verdicts, compromise (失陷) detection intelligence and vulnerability
    intelligence. Requests are HTTP GET with the indicator supplied as the `param` query string, authenticated
    with an `Api-Key` request header, returning JSON. Probed unauthenticated: the API host answers 401
    application/json with {"message":"No API key found in request"}.'
  humanURL: https://ti.qianxin.com/help
  baseURL: https://webapi.ti.qianxin.com
  tags:
  - Threat Intelligence
  - Security
  - Reputation
