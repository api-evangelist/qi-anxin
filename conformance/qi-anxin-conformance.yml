standards:
- id: mcp
  name: Model Context Protocol
  conforms: true
  evidence: 'QAX publishes a hosted MCP server at https://mcp.ti.qianxin.com/ti-stream-mcp
    over the Streamable HTTP transport, documented in its own configuration manual
    with 16 named tools and Mcp-Session-Id session tracking. Announced on the QAX newsroom
    2025-05-13.'
  note: Streamable HTTP supported and preferred; SSE supported but deprecated; stdio
    explicitly not supported.
- id: openapi
  name: OpenAPI
  conforms: false
