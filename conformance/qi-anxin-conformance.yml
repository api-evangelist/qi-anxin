    /openapi.yaml, /v1/openapi.json, /api-docs, /docs and /redoc against www.qianxin.com,
    en.qianxin.com, ti.qianxin.com and webapi.ti.qianxin.com — www./en. return 404,
    ti. returns the SPA catch-all shell for every path, webapi. returns 401 JSON.'
