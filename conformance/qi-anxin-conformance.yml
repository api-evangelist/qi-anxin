domain_standards:
- id: cve
  name: CVE (Common Vulnerabilities and Exposures)
  conforms: true
  evidence: 'The published MCP tool query_vuln_by_id accepts a CVE identifier as its
    lookup key ("通过CVE/CNNVD/CNVD编号查询漏洞详情"), and query_vuln_list filters
    on CVE-keyed dimensions. Documented at https://github.com/RedDrip7/qax-ti-mcp.'
  note: The contract itself speaks CVE identifiers — a consumer already holding a
    CVE integrates with no bespoke mapping.
- id: cnnvd
  name: CNNVD (China National Vulnerability Database of Information Security)
  conforms: true
  evidence: query_vuln_by_id accepts CNNVD identifiers directly, per the provider's
    published tool description.
- id: cnvd
  name: CNVD (China National Vulnerability Database)
  conforms: true
  evidence: query_vuln_by_id accepts CNVD identifiers directly, per the provider's
    published tool description.
- id: mitre-attack
  name: MITRE ATT&CK
  conforms: true
  evidence: 'The threat-actor profile surface is documented as returning "IOC、漏洞CVE、报告链接、ATT&CK战术、动机、技战法"
    — ATT&CK tactics are a named field of the threat-actor response. Source: https://github.com/RedDrip7/qax-ti-mcp
    §六.'
  note: Reward-only check — the threat-intelligence market''s domain vocabulary (CVE,
    ATT&CK) is declared by the contract''s own tool surface, not merely claimed in
    marketing prose.
- id: stix-taxii
  name: STIX / TAXII
  conforms: false
  evidence: No STIX bundle or TAXII 2.x collection endpoint is documented on the public
    surface. Intelligence is returned as vendor-shaped JSON.
  note: 'The most consequential gap for this provider: STIX/TAXII is the interchange
    standard of its own market, and a buyer already running a TAXII client needs a
    bespoke connector for QAX where a competitor publishing TAXII would need none.'
